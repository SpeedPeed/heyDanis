name: Build heyDanis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build HeyDanis.sln -c Release

      - name: Test
        run: dotnet test HeyDanis.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # A normal folder (not single-file): the native Whisper/Piper libraries must sit
      # next to the exe, single-file extraction to %TEMP% breaks their loaders.
      - name: Publish app folder
        run: >
          dotnet publish src/HeyDanis.App/HeyDanis.App.csproj -c Release -r win-x64
          --self-contained true -p:DebugType=none -o publish/win-x64

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: heyDanis-win-x64
          path: publish/win-x64/
          retention-days: 30

      # Small update package: only heyDanis' own files (~1 MB instead of ~85 MB).
      # Extract it over an existing full install; the full package is only needed
      # again when a library/dependency changes.
      - name: Collect small update package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/update | Out-Null
          Get-ChildItem publish/win-x64 -File |
            Where-Object { $_.Name -like 'heyDanis*' } |
            Copy-Item -Destination publish/update
          Get-ChildItem publish/update | Format-Table Name, Length

      - name: Upload small update package
        uses: actions/upload-artifact@v4
        with:
          name: heyDanis-UPDATE-klein
          path: publish/update/
          retention-days: 30

      # Medium update: heyDanis' files plus the speech libraries (Whisper, sherpa-onnx,
      # onnxruntime). Needed when one of those packages changes, still far below 85 MB.
      - name: Collect speech-library update package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/update-speech | Out-Null
          Get-ChildItem publish/win-x64 -File |
            Where-Object { $_.Name -like 'heyDanis*' -or $_.Name -like 'sherpa*' -or $_.Name -like 'onnxruntime*' -or $_.Name -like 'Whisper*' } |
            Copy-Item -Destination publish/update-speech
          Copy-Item -Recurse publish/win-x64/runtimes publish/update-speech/runtimes

      - name: Upload speech-library update package
        uses: actions/upload-artifact@v4
        with:
          name: heyDanis-UPDATE-mit-Sprachbibliotheken
          path: publish/update-speech/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          retention-days: 7
